<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bai 11:</title>
  </head>
  <body>
    <h2>Điểm của sinh viên là</h2>
    <div>
      Điểm A:<input type="number" id="diemA" placeholder="Mời nhập điểm A" />
    </div>
    <div>
      Điểm B:<input type="number" id="diemB" placeholder="Mời nhập điểm B" />
    </div>
    <div>
      Điểm C:<input type="number" id="diemC" placeholder="Mời nhập điểm C" />
    </div>
    <div>
      <button onclick="xemketqua()">Tính điểm</button>
    </div>
    <div>kết quả :<input type="text" id="ketqua" /></div>

    <script>
      //  Tao ham tinh diem cua sinh vien dua vao 3 diem a ,b ,c
      //     Biet rang diem=a*0.6+b*0.3+c*0.1
      function xemketqua() {
        let diemA = parseFloat(document.getElementById("diemA").value);
        let diemB = parseFloat(document.getElementById("diemB").value);
        let diemC = parseFloat(document.getElementById("diemC").value);
        tinhtongdiem(diemA, diemB, diemC);
      }

      function tinhtongdiem(a, b, c) {
        let tong;
        if (kiemtrahople(a, b, c) == true) {
          tong = a * 0.6 + b * 0.3 + c * 0.1;
          if (tong >= 9) {
            document.write("diem chu la A+ ");
          } else if (tong >= 8.5 && tong < 9) {
            document.write("diem chu la A ");
          } else if (tong >= 8 && tong < 8.5) {
            document.write("diem chu la B+ ");
          } else if (tong >= 7.5 && tong < 8) {
            document.write("diem chu la B ");
          } else if (tong >= 7 && tong < 7.5) {
            document.write("diem chu la C+ ");
          } else if (tong >= 6.5 && tong < 7) {
            document.write("diem chu la C ");
          } else if (tong >= 6 && tong < 6.5) {
            document.write("diem chu la D+ ");
          } else if (tong >= 5 && tong < 6) {
            document.write("diem chu la D ");
          } else {
            document.write("diem chu la F ");
          }
        }
        function kiemtrahople(a, b, c) {
          let ketqua = true;
          if (a < 0 || a > 10 || typeof a != "number") {
            document.write("Điểm A không hợp lệ!");
            ketqua = false;
          }
        }
        if (b < 0 || b > 10 || typeof b != "number") {
          document.write("Điểm B không hợp lệ !");
          ketqua = false;
        }
        if (c < 0 || c > 10 || typeof c != "number") {
          document.write("Điểm C không hợp lệ!");
          ketqua = false;
        }
        return ketqua;
      }
      //   let a = 3;
      //   let b = 2;
      //   let c = 11;
      tinhtongdiem(a, b, c);
    </script>
  </body>
</html>
